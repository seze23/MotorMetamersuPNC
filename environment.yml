name: motor-meta-simplified
channels:
  - opensim-org
  - pytorch
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - mujoco>=3.4
      - myo-sim==0.2.3
  - opensim=4.4
  # Compatible with myo-sim (>=1.24), OpenSim, and this SciPy build.
  - numpy=1.26.4
  - pandas
  - scipy
  - matplotlib
  - pyyaml
  - h5py
  - tqdm
  - pytorch
