experiment: reach_location_grid
musculoskeletal_model: myosuite_corrected
display_simulation: false

myosuite:
  model: myoarm
  ik:
    iterations: 80
    damping: 0.0001
    nullspace_gain: 0.05
    max_step_rad: 0.08
    tolerance_m: 0.0005

ik:
  lock_wrist: true
  locked_wrist_degrees:
    pro_sup: -30.0
    deviation: 0.0
    flexion: 0.0

proprioception:
  model_family: extended
  coefficient_seed: 0
  model_coefficient_seed: 0
  training_seed: 9
  model_path: null
  temporal_padding_mode: replicate

muscle_lengths:
  align_opensim_rest: true
  drive_distal_coordinates: false

path:
  generator: process/generate_paths/generatereachpath.py
  sample_rate_hz: 240
  directions_degrees: [0, 15, 30, 45, 60, 75, 90, 105, 120, 135, 150, 165, 180, 195, 210, 225, 240, 255, 270, 285, 300, 315, 330, 345]
  radii_cm: [4, 8, 12]
  max_displacement_cm: 12.1
  center_source: opensim_marker
  legacy_inclusive_timebase: true
  rest_pose_degrees:
    elv_angle: 20.0
    shoulder_elv: 40.0
    shoulder_rot: 25.0
    elbow_flexion: 85.0
  timing_seconds:
    hold_before: 1.65
    reach: 0.50
    hold_target: 0.50
    return: 0.50
    hold_after: 1.65
