experiment: center_out
display_simulation: false

visualization:
  playback_speed: 1.0
  max_fps: 60
  # Display-only floor height; this does not alter the model or motion data.
  ground_height_m: -1.0

ik:
  # Keeps the underconstrained one-marker IK solution near the configured pose.
  coordinate_regularization_weight: 0.001

path:
  # Any Python generator can be selected here. Setting this to
  # process/generate_paths/draw.py opens a GUI for drawing and naming paths.
  generator: process/generate_paths/generatereachpath.py
  sample_rate_hz: 240
  reach_cm: 10.0
  max_displacement_cm: 15.0
  rest_pose_degrees:
    elv_angle: 20.0
    shoulder_elv: 40.0
    shoulder_rot: 25.0
    elbow_flexion: 85.0
  timing_seconds:
    hold_before: 1.65
    reach: 0.50
    hold_target: 0.50
    return: 0.50
    hold_after: 1.65
