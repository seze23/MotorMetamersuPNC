experiment: center_out
display_simulation: false

visualization:
  playback_speed: 1.0
  max_fps: 60
  # Display-only floor height; this does not alter the model or motion data.
  ground_height_m: -1.0

ik:
  # Select "nimble" for differentiable IK or "opensim" for the legacy tool.
  backend: opensim
  # Rigidly brace wrist motion and forearm rotation, as in the KINARM setup.
  lock_wrist: true
  locked_wrist_degrees:
    # KINARM grip: the palm/opening faces upward; wrist bend remains neutral.
    pro_sup: -30.0
    deviation: 0.0
    flexion: 0.0
  # Keeps the underconstrained one-marker IK solution near the configured pose.
  coordinate_regularization_weight: 0.001
  nimble:
    wsl_distribution: Ubuntu
    python: /home/braydenk/.venvs/motor-meta-nimble/bin/python
    iterations: 12
    damping: 0.00001
    posture_weight: 0.00001

proprioception:
  # "extended" selects one of the 20 robustness models. Use "main" only to
  # reproduce the paper's single Figure 3 example model.
  model_family: extended
  # Optional checkpoint directory, relative to the repository or absolute.
  # Set this to null to derive the path from model_family and the two seeds.
  model_path: trained_models/experiment_causal_flag-pcr_optimized_linear_extended_5_5_letter_reconstruction_joints/spatiotemporal_4_8-8-32-64_7171_0_9
  # For extended models, the directory suffix is
  # {coefficient_seed}_{training_seed}. The spindle generator automatically
  # uses the same coefficient seed.
  coefficient_seed: 0
  training_seed: 9

path:
  # Any Python generator can be selected here. Setting this to
  # process/generate_paths/draw.py opens a GUI for drawing and naming paths.
  generator: process/generate_paths/generatereachpath.py
  sample_rate_hz: 240
  reach_cm: 10.0
  max_displacement_cm: 15.0
  rest_pose_degrees:
    elv_angle: 20.0
    shoulder_elv: 40.0
    shoulder_rot: 25.0
    elbow_flexion: 85.0
  timing_seconds:
    hold_before: 1.65
    reach: 0.50
    hold_target: 0.50
    return: 0.50
    hold_after: 1.65
