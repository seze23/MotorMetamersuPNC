experiment: wang_pilot
musculoskeletal_model: opensim
display_simulation: false

ik:
  backend: opensim
  lock_wrist: true
  locked_wrist_degrees:
    pro_sup: 0.0
    deviation: 0.0
    flexion: 0.0
  marker_weight: 10000.0
  coordinate_regularization_weight: 0.001

proprioception:
  model_family: extended
  model_path: trained_models/experiment_causal_flag-pcr_optimized_linear_extended_5_5_letter_reconstruction_joints/spatiotemporal_4_8-8-32-64_7171_0_9
  coefficient_seed: 0
  training_seed: 9
  temporal_padding_mode: replicate

muscle_lengths:
  drive_distal_coordinates: true

path:
  generator: process/generate_paths/generate_wang_pilot.py
  sample_rate_hz: 240
  max_displacement_cm: 26.0
  endpoint_tolerance_cm: 0.5
  rest_pose_degrees:
    elv_angle: 20.0
    shoulder_elv: 40.0
    shoulder_rot: 25.0
    elbow_flexion: 85.0
  timing_seconds:
    hold_before: 1.65
    reach: 0.50
    hold_target: 1.25
